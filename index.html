<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b7cfa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lingo — vaikų vertėjas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(170deg,#a8d8ff 0%,#c7c4ff 45%,#ffd6ec 100%);
    color:#33305e;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  #bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(28px);opacity:.55;animation:float 14s ease-in-out infinite}
  .b1{width:230px;height:230px;background:#fff3a8;top:-60px;left:-50px}
  .b2{width:200px;height:200px;background:#9ef5d8;bottom:8%;right:-60px;animation-delay:-4s}
  .b3{width:170px;height:170px;background:#ffb3d9;top:38%;left:-70px;animation-delay:-8s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-26px) scale(1.09)}}
  .star{position:absolute;font-size:16px;opacity:.7;animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8) rotate(0deg)}50%{opacity:.85;transform:scale(1.15) rotate(18deg)}}

  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(env(safe-area-inset-bottom,0px) + 10px);
    max-width:560px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;letter-spacing:.2px;
    text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .brand small{display:block;font-weight:700;font-size:10.5px;opacity:.62;letter-spacing:.3px}
  .iconbtn{width:40px;height:40px;border:none;border-radius:14px;background:rgba(255,255,255,.66);
    box-shadow:0 4px 12px rgba(80,70,160,.16);font-size:19px;cursor:pointer;display:grid;place-items:center;
    transition:transform .15s}
  .iconbtn:active{transform:scale(.9)}

  .langbar{flex:0 0 auto;display:flex;gap:6px;margin-top:10px;background:rgba(255,255,255,.5);
    padding:5px;border-radius:16px;box-shadow:inset 0 1px 3px rgba(90,80,160,.12)}
  .langbar button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:12px;
    font:inherit;font-weight:800;font-size:13px;color:#5a5590;cursor:pointer;transition:.2s}
  .langbar button.on{background:#fff;color:#3b3780;box-shadow:0 3px 10px rgba(90,80,160,.2)}

  .stage{flex:1 1 auto;position:relative;display:flex;flex-direction:column;align-items:center;
    justify-content:center;min-height:0}
  #bubble{background:#fff;border-radius:20px;padding:10px 16px;font-weight:800;font-size:15px;
    box-shadow:0 8px 22px rgba(80,70,160,.18);position:relative;max-width:90%;text-align:center;
    transition:opacity .25s, transform .25s;line-height:1.35;z-index:2}
  #bubble:after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
    border:10px solid transparent;border-top-color:#fff;border-bottom:0}
  #bubble.hide{opacity:0;transform:translateY(8px) scale(.95)}

  #heroWrap{width:min(70vw,240px);max-height:42vh;aspect-ratio:1;margin-top:8px;position:relative;
    animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-11px) rotate(1deg)}}
  body.listening #heroWrap{animation:bobfast 1.1s ease-in-out infinite}
  @keyframes bobfast{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.03)}}
  body.thinking #heroWrap{animation:think 1.6s ease-in-out infinite}
  @keyframes think{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  #hero{width:100%;height:100%;overflow:visible}
  #heroImg{display:none;width:100%;height:100%;object-fit:cover;border-radius:26%;
    box-shadow:0 14px 34px rgba(80,70,160,.3), 0 0 0 6px rgba(255,255,255,.75);
    transition:transform .08s}
  #heroWrap.hasimg #hero{display:none}
  #heroWrap.hasimg #heroImg{display:block}
  #genOverlay{position:absolute;inset:0;display:none;place-items:center;border-radius:26%;
    background:rgba(255,255,255,.72);backdrop-filter:blur(2px);z-index:3;flex-direction:column;gap:8px;
    font-weight:900;font-size:13px;text-align:center;padding:10px}
  #genOverlay.show{display:grid}
  .spin{width:34px;height:34px;border-radius:50%;border:4px solid #cfc9f5;border-top-color:#5b5be0;
    animation:spin 1s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  .cards{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .card{background:rgba(255,255,255,.9);border-radius:18px;padding:11px 14px;
    box-shadow:0 6px 18px rgba(80,70,160,.14);display:none}
  .card.show{display:block;animation:pop .32s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .card .lbl{font-size:10.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;opacity:.5;
    display:flex;align-items:center;gap:6px}
  .card .txt{font-size:16px;font-weight:800;margin-top:3px;line-height:1.3;word-wrap:break-word}
  #cardOut{background:linear-gradient(135deg,#fff 0%,#fff8e6 100%)}
  #outTxt{font-size:22px;color:#2f2b63}
  #outTr{font-size:13px;font-weight:700;opacity:.55;margin-top:3px;font-style:italic}
  .cardrow{display:flex;align-items:flex-start;gap:10px}
  .cardrow>div{flex:1;min-width:0}
  #replay{flex:0 0 auto;width:46px;height:46px;border:none;border-radius:50%;
    background:linear-gradient(150deg,#ffd465,#ff9f43);color:#fff;font-size:21px;cursor:pointer;
    box-shadow:0 5px 14px rgba(255,150,50,.45);transition:transform .15s}
  #replay:active{transform:scale(.88)}

  .controls{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:7px}
  #hint{font-size:12.5px;font-weight:800;opacity:.62;min-height:16px;text-align:center}
  .micwrap{position:relative;width:98px;height:98px;display:grid;place-items:center}
  .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.85);opacity:0}
  body.listening .ring{animation:ripple 1.5s ease-out infinite}
  body.listening .ring:nth-child(2){animation-delay:.5s}
  @keyframes ripple{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.6);opacity:0}}
  #mic{width:88px;height:88px;border:none;border-radius:50%;cursor:pointer;position:relative;
    background:linear-gradient(150deg,#7c8dff,#5b5be0);color:#fff;font-size:36px;
    box-shadow:0 10px 26px rgba(70,70,190,.45), inset 0 -4px 0 rgba(0,0,0,.14);
    transition:transform .12s, background .3s;display:grid;place-items:center}
  #mic:active{transform:scale(.93)}
  body.listening #mic{background:linear-gradient(150deg,#ff8fa8,#f4436d);
    box-shadow:0 10px 26px rgba(240,60,110,.5), inset 0 -4px 0 rgba(0,0,0,.14)}
  body.thinking #mic{background:linear-gradient(150deg,#ffd465,#ff9f43)}

  dialog{border:none;border-radius:22px;padding:0;max-width:340px;width:calc(100% - 32px);
    box-shadow:0 20px 60px rgba(50,40,110,.35)}
  dialog::backdrop{background:rgba(40,35,80,.5);backdrop-filter:blur(3px)}
  .dlg{padding:20px;font-size:14px;line-height:1.45}
  .dlg h3{margin:0 0 4px;font-size:17px}
  .dlg p{margin:0 0 12px;font-size:12.5px;opacity:.7}
  .dlg label{display:block;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;
    opacity:.55;margin:12px 0 5px}
  .dlg input,.dlg select{width:100%;padding:11px 12px;border-radius:12px;border:2px solid #e3e0f5;
    font:inherit;font-size:14px;background:#faf9ff;color:#33305e}
  .dlg input:focus,.dlg select:focus{outline:none;border-color:#7c8dff}
  .row{display:flex;gap:8px;align-items:center;margin-top:14px}
  .btn{flex:1;border:none;border-radius:14px;padding:13px;font:inherit;font-weight:900;font-size:14px;
    cursor:pointer;background:linear-gradient(150deg,#7c8dff,#5b5be0);color:#fff;
    box-shadow:0 6px 16px rgba(80,80,200,.35)}
  .btn.ghost{background:#f0eefb;color:#5a5590;box-shadow:none;flex:0 0 auto;padding:13px 16px}
  .btn.warn{background:linear-gradient(150deg,#ffd465,#ff9f43);box-shadow:0 6px 16px rgba(255,150,50,.35)}
  .switch{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-weight:800;font-size:13px}
  .switch input{width:auto;transform:scale(1.35);accent-color:#5b5be0}
  .tiny{font-size:11px;opacity:.6;margin-top:10px;line-height:1.5}
  .tiny a{color:#5b5be0}

  #hist{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  #hist::-webkit-scrollbar{display:none}
  #hist button{flex:0 0 auto;border:none;background:rgba(255,255,255,.65);border-radius:12px;
    padding:7px 11px;font:inherit;font-size:12px;font-weight:800;color:#4b4788;cursor:pointer;
    max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  @media (max-height:640px){
    #heroWrap{width:min(54vw,180px)}
    #outTxt{font-size:19px}
    #mic{width:76px;height:76px;font-size:31px}
    .micwrap{width:86px;height:86px}
  }
</style>
</head>
<body>
<div id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="star" style="top:14%;left:16%">⭐</div>
  <div class="star" style="top:26%;right:12%;animation-delay:-1.4s">✨</div>
  <div class="star" style="bottom:30%;left:9%;animation-delay:-2.6s">✨</div>
  <div class="star" style="top:52%;right:8%;animation-delay:-3.4s">⭐</div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <span style="font-size:24px">🌍</span>
      <span>Lingo<small>vertėjas vaikams</small></span>
    </div>
    <button class="iconbtn" id="btnSet" aria-label="Nustatymai">⚙️</button>
  </header>

  <div class="langbar">
    <button data-mode="auto" class="on">✨ Automatiškai</button>
    <button data-mode="lt">🇱🇹 → 🇷🇺</button>
    <button data-mode="ru">🇷🇺 → 🇱🇹</button>
  </div>

  <div class="stage">
    <div id="bubble">Paspausk mikrofoną ir kalbėk! 🎤</div>

    <div id="heroWrap">
      <!-- Laikinas SVG personažas, kol Gemini sugeneruoja tikrą -->
      <svg id="hero" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="gBody" cx="38%" cy="28%" r="82%">
            <stop offset="0%" stop-color="#a8f0e2"/><stop offset="55%" stop-color="#5fd7c4"/><stop offset="100%" stop-color="#2fae9e"/>
          </radialGradient>
          <radialGradient id="gBelly" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#fffdf3"/><stop offset="100%" stop-color="#ffeec2"/>
          </radialGradient>
          <radialGradient id="gEye" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#6a5f8f"/><stop offset="100%" stop-color="#241f45"/>
          </radialGradient>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
          <clipPath id="clipL"><ellipse cx="120" cy="128" rx="25" ry="27"/></clipPath>
          <clipPath id="clipR"><ellipse cx="180" cy="128" rx="25" ry="27"/></clipPath>
        </defs>
        <ellipse cx="150" cy="279" rx="66" ry="11" fill="#4b3f8a" opacity=".22" filter="url(#soft)"/>
        <g id="char">
          <g id="antenna">
            <path d="M150 62 C 146 44 152 34 150 24" stroke="#2fae9e" stroke-width="7" fill="none" stroke-linecap="round"/>
            <circle id="bulb" cx="150" cy="20" r="11" fill="#ffe06a"/>
            <circle cx="146" cy="16" r="3.4" fill="#fff" opacity=".85"/>
          </g>
          <g id="earL">
            <ellipse cx="82" cy="96" rx="26" ry="31" fill="url(#gBody)" transform="rotate(-20 82 96)"/>
            <ellipse cx="84" cy="98" rx="14" ry="18" fill="#ff92b8" transform="rotate(-20 84 98)" opacity=".8"/>
          </g>
          <g id="earR">
            <ellipse cx="218" cy="96" rx="26" ry="31" fill="url(#gBody)" transform="rotate(20 218 96)"/>
            <ellipse cx="216" cy="98" rx="14" ry="18" fill="#ff92b8" transform="rotate(20 216 98)" opacity=".8"/>
          </g>
          <g id="armL"><ellipse cx="58" cy="205" rx="17" ry="25" fill="url(#gBody)" transform="rotate(18 58 205)"/></g>
          <g id="armR"><ellipse cx="242" cy="205" rx="17" ry="25" fill="url(#gBody)" transform="rotate(-18 242 205)"/></g>
          <ellipse cx="150" cy="205" rx="76" ry="66" fill="url(#gBody)"/>
          <ellipse cx="150" cy="214" rx="52" ry="47" fill="url(#gBelly)"/>
          <ellipse cx="116" cy="262" rx="24" ry="14" fill="#2fae9e"/>
          <ellipse cx="184" cy="262" rx="24" ry="14" fill="#2fae9e"/>
          <circle cx="150" cy="130" r="80" fill="url(#gBody)"/>
          <ellipse cx="122" cy="102" rx="30" ry="22" fill="#fff" opacity=".22" transform="rotate(-24 122 102)"/>
          <ellipse cx="150" cy="163" rx="46" ry="35" fill="url(#gBelly)" opacity=".95"/>
          <ellipse cx="97" cy="155" rx="17" ry="11" fill="#ff8fb3" opacity=".45"/>
          <ellipse cx="203" cy="155" rx="17" ry="11" fill="#ff8fb3" opacity=".45"/>
          <g id="eyes">
            <ellipse cx="120" cy="128" rx="25" ry="27" fill="#fff"/>
            <ellipse cx="180" cy="128" rx="25" ry="27" fill="#fff"/>
            <g id="pupils">
              <circle cx="120" cy="130" r="14" fill="url(#gEye)"/><circle cx="180" cy="130" r="14" fill="url(#gEye)"/>
              <circle cx="115" cy="124" r="5.5" fill="#fff"/><circle cx="175" cy="124" r="5.5" fill="#fff"/>
            </g>
            <g id="lids">
              <rect x="93" y="72" width="54" height="30" fill="url(#gBody)" clip-path="url(#clipL)"/>
              <rect x="153" y="72" width="54" height="30" fill="url(#gBody)" clip-path="url(#clipR)"/>
            </g>
          </g>
          <ellipse cx="150" cy="152" rx="9" ry="7" fill="#ff7fa8"/>
          <g id="mouthG"><path id="mouth" d="M128 166 Q 150 182 172 166 Q 150 174 128 166" fill="#4a1a2c"/></g>
        </g>
      </svg>
      <img id="heroImg" alt="Personažas">
      <div id="genOverlay"><div><div class="spin"></div><div id="genTxt" style="margin-top:8px">Piešiu personažą... 🎨</div></div></div>
    </div>
  </div>

  <div id="hist"></div>

  <div class="cards">
    <div class="card" id="cardIn">
      <div class="lbl"><span id="inFlag">🇱🇹</span> <span>Pasakei</span></div>
      <div class="txt" id="inTxt"></div>
    </div>
    <div class="card" id="cardOut">
      <div class="cardrow">
        <div>
          <div class="lbl"><span id="outFlag">🇷🇺</span> <span id="outLbl">Vertimas</span></div>
          <div class="txt" id="outTxt"></div>
          <div id="outTr"></div>
        </div>
        <button id="replay" aria-label="Pakartoti">🔊</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div id="hint">Paspausk ir kalbėk 🎤</div>
    <div class="micwrap">
      <div class="ring"></div><div class="ring"></div>
      <button id="mic" aria-label="Kalbėti">🎤</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg">
    <h3>Nustatymai ⚙️</h3>
    <p>Raktas saugomas tik šiame telefone ir siunčiamas tik į Google Gemini.</p>
    <label>Gemini API raktas</label>
    <input id="key" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false">
    <label>Balsas</label>
    <select id="voice">
      <option value="Leda" selected>Leda — jaunatviškas, šiltas</option>
      <option value="Kore">Kore — aiškus, tvirtas</option>
      <option value="Puck">Puck — linksmas</option>
      <option value="Zephyr">Zephyr — šviesus</option>
      <option value="Aoede">Aoede — lengvas</option>
    </select>
    <label>Kalbėjimo greitis</label>
    <select id="rate">
      <option value="0.85">Labai lėtai 🐢</option>
      <option value="0.95" selected>Lėtai (vaikams)</option>
      <option value="1">Normaliai</option>
    </select>
    <div class="switch"><span>Rodyti tarimą raidėmis</span><input type="checkbox" id="trlit" checked></div>
    <div class="row">
      <button class="btn warn" id="btnRegen" style="flex:1">🎨 Naujas personažas</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="dlgClose">✕</button>
      <button class="btn" id="dlgSave">Išsaugoti</button>
    </div>
    <div class="tiny">Nemokamą raktą gauk per 1 min: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></div>
  </div>
</dialog>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
// saugus localStorage (kai kur, pvz. atidarius kaip failą, jis būna užblokuotas)
const LS = (function(){
  try{
    window.localStorage.setItem('lingo._t','1');
    window.localStorage.removeItem('lingo._t');
    return window.localStorage;
  }catch(e){
    const mem = {};
    return {
      getItem: function(k){ return (k in mem) ? mem[k] : null; },
      setItem: function(k,v){ mem[k] = String(v); },
      removeItem: function(k){ delete mem[k]; }
    };
  }
})();

/* ================= būsena ================= */
const S = {
  key: LS.getItem('lingo.key') || '',
  mode: LS.getItem('lingo.mode') || 'auto',
  voice: LS.getItem('lingo.voice') || 'Leda',
  rate: parseFloat(LS.getItem('lingo.rate') || '0.95'),
  trlit: LS.getItem('lingo.trlit') !== '0',
  busy: false,
  last: null,
  hist: []
};
try{ S.hist = JSON.parse(LS.getItem('lingo.hist') || '[]'); }catch(e){ S.hist = []; }
const NAME = { lt:{flag:'🇱🇹', name:'Lietuviškai', tag:'lt-LT'}, ru:{flag:'🇷🇺', name:'Rusiškai', tag:'ru-RU'} };

/* ================= personažas: SVG placeholder + Gemini kadrai ================= */
const heroWrap = $('#heroWrap'), heroImg = $('#heroImg');
const mouth = $('#mouth'), lids = $('#lids'), pupils = $('#pupils'), bulb = $('#bulb'),
      earL = $('#earL'), earR = $('#earR'), armL = $('#armL'), armR = $('#armR');
let frames = { closed: LS.getItem('lingo.img.closed') || '', open: LS.getItem('lingo.img.open') || '' };
let curFrame = '';
function applyFrames(){
  if (frames.closed){
    heroWrap.classList.add('hasimg');
    if (curFrame !== 'closed'){ heroImg.src = frames.closed; curFrame = 'closed'; }
  } else heroWrap.classList.remove('hasimg');
}
applyFrames();

let openAmt = 0, targetOpen = 0, t = 0, state = 'idle';
function mouthPath(o){
  const y = 168, w = 22 + o*6, h = 4 + o*26;
  return 'M ' + (150-w) + ' ' + y + ' Q 150 ' + (y+h) + ' ' + (150+w) + ' ' + y + ' Q 150 ' + (y+h*0.45) + ' ' + (150-w) + ' ' + y;
}
function tick(){
  t += 0.016;
  openAmt += (targetOpen - openAmt) * 0.35;

  if (heroWrap.classList.contains('hasimg')){
    // Gemini personažas: keičiam kadrus + lengvas "squash"
    const wantOpen = state==='talking' && openAmt > 0.4;
    const f = wantOpen && frames.open ? 'open' : 'closed';
    if (f !== curFrame){ heroImg.src = frames[f]; curFrame = f; }
    heroImg.style.transform = state==='talking' ? ('scaleY(' + (1+openAmt*0.045) + ') scaleX(' + (1-openAmt*0.02) + ')') : '';
  } else {
    // SVG placeholder animacija
    mouth.setAttribute('d', state==='talking' ? mouthPath(openAmt) : 'M 128 166 Q 150 182 172 166 Q 150 174 128 166');
    const blink = (Math.sin(t*0.9)>0.985 || Math.sin(t*1.7+2)>0.993) ? 1 : 0;
    lids.setAttribute('transform', 'translate(0 ' + (blink?56:0) + ')');
    pupils.setAttribute('transform', 'translate(' + (Math.sin(t*0.6)*3.5) + ' ' + (Math.cos(t*0.45)*2.5) + ')');
    const e = state==='listening' ? Math.sin(t*7)*10 : Math.sin(t*1.3)*3;
    earL.setAttribute('transform', 'rotate(' + (-e) + ' 82 110)');
    earR.setAttribute('transform', 'rotate(' + e + ' 218 110)');
    const a = state==='talking' ? Math.sin(t*8)*16 : (state==='listening'? Math.sin(t*5)*8 : Math.sin(t*1.2)*4);
    armL.setAttribute('transform', 'rotate(' + (-a) + ' 66 190)');
    armR.setAttribute('transform', 'rotate(' + a + ' 234 190)');
    bulb.setAttribute('fill', state==='listening' ? '#ff5f8d' : state==='thinking' ? '#ffb340' : state==='talking' ? '#7cf0ff' : '#ffe06a');
    bulb.setAttribute('r', 10 + (state==='idle'?Math.sin(t*2)*1.2:Math.sin(t*9)*2.5));
  }
  if (state==='talking' && Math.random()<0.25) targetOpen = Math.random()*0.9+0.1;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function setState(s){ state = s; document.body.className = s; if (s!=='talking') targetOpen = 0; }
function say(txt){ const b=$('#bubble'); b.classList.add('hide');
  setTimeout(function(){ b.textContent = txt; b.classList.remove('hide'); }, 180); }

/* ================= garso pagalbinės ================= */
let ac = null;
function actx(){ if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function downsample(buf, from, to){
  if (to >= from) return buf;
  const ratio = from/to, len = Math.round(buf.length/ratio), out = new Float32Array(len);
  let oi=0, ii=0;
  while(oi<len){
    const next = Math.round((oi+1)*ratio);
    let sum=0, n=0;
    for(let i=ii;i<next && i<buf.length;i++){ sum+=buf[i]; n++; }
    out[oi] = n? sum/n : 0; oi++; ii = next;
  }
  return out;
}
function encodeWav(samples, rate){
  const b = new ArrayBuffer(44 + samples.length*2), v = new DataView(b);
  const w = function(o,s){ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36+samples.length*2, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, samples.length*2, true);
  let o=44;
  for(let i=0;i<samples.length;i++){ const s=Math.max(-1,Math.min(1,samples[i])); v.setInt16(o, s<0?s*0x8000:s*0x7FFF, true); o+=2; }
  return b;
}
function toB64(buf){
  const bytes = new Uint8Array(buf); let bin='';
  for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
function b64ToBytes(b64){
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

/* ================= įrašymas ================= */
let stream=null, src=null, proc=null, sink=null, chunks=[], recording=false;
async function startRec(){
  const c = actx();
  if (c.state === 'suspended') await c.resume();
  stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  src = c.createMediaStreamSource(stream);
  proc = c.createScriptProcessor(4096, 1, 1);
  sink = c.createGain(); sink.gain.value = 0;
  chunks = [];
  proc.onaudioprocess = function(e){
    if (!recording) return;
    chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  src.connect(proc); proc.connect(sink); sink.connect(c.destination);
  recording = true;
}
function stopRec(){
  recording = false;
  try{ if(proc){ proc.disconnect(); proc.onaudioprocess=null; } if(src) src.disconnect(); if(sink) sink.disconnect(); }catch(e){}
  if (stream) stream.getTracks().forEach(function(tr){ tr.stop(); });
  stream=null; src=null; proc=null; sink=null;
  let len=0; chunks.forEach(function(c){ len+=c.length; });
  const all = new Float32Array(len); let off=0;
  chunks.forEach(function(c){ all.set(c, off); off+=c.length; });
  chunks=[];
  const rate = actx().sampleRate;
  return { wav: encodeWav(downsample(all, rate, 16000), 16000), seconds: all.length/rate };
}

/* ================= Gemini API ================= */
const API = 'https://generativelanguage.googleapis.com/v1beta/models/';

async function gpost(model, body){
  const r = await fetch(API + model + ':generateContent?key=' + encodeURIComponent(S.key), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  if (!r.ok){
    let msg = 'HTTP ' + r.status;
    try{ const e = await r.json(); msg = (e.error && e.error.message) || msg; }catch(_){}
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return r.json();
}

/* --- vertimas (garso atpažinimas + vertimas vienu kartu) --- */
function trPrompt(){
  const dir = S.mode==='lt' ? 'Įraše kalbama LIETUVIŠKAI. Išversk į RUSŲ kalbą.'
            : S.mode==='ru' ? 'Įraše kalbama RUSIŠKAI. Išversk į LIETUVIŲ kalbą.'
            : 'Nustatyk, ar įraše kalbama lietuviškai, ar rusiškai. Jei lietuviškai - išversk į rusų kalbą. Jei rusiškai - išversk į lietuvių kalbą.';
  return 'Tu esi draugiškas vertėjas dviem vaikams, kurie žaidžia kartu. Vienas kalba lietuviškai, kitas rusiškai.\n' + dir + '\n' +
'Taisyklės:\n' +
'- Perrašyk TIKSLIAI tai, ką vaikas pasakė (source_text), originalo kalba, su skyryba.\n' +
'- Vertimas (target_text) turi būti paprastas, natūralus, vaikiškas, ta pačia intonacija.\n' +
'- Jei įraše nieko nesigirdi ar neaišku, source_text palik tuščią.\n' +
'- transliteration: vertimo tarimas skaitytojo kalbos raidėmis. Jei vertimas rusiškas - užrašyk jį lotyniškomis raidėmis (pvz. "Привет" -> "Privjet"). Jei vertimas lietuviškas - užrašyk kirilica (pvz. "Labas" -> "Лабас").\n' +
'- Jokių paaiškinimų, tik JSON.';
}
async function translate(wav){
  const j = await gpost('gemini-2.5-flash', {
    contents:[{ role:'user', parts:[
      { text: trPrompt() },
      { inline_data: { mime_type:'audio/wav', data: toB64(wav) } }
    ]}],
    generationConfig:{
      temperature: 0.2,
      thinkingConfig: { thinkingBudget: 0 },
      responseMimeType: 'application/json',
      responseSchema: {
        type:'OBJECT',
        properties:{
          source_lang:{ type:'STRING', enum:['lt','ru'] },
          source_text:{ type:'STRING' },
          target_lang:{ type:'STRING', enum:['lt','ru'] },
          target_text:{ type:'STRING' },
          transliteration:{ type:'STRING' }
        },
        required:['source_lang','source_text','target_lang','target_text','transliteration']
      }
    }
  });
  const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
  const txt = parts.map(function(p){ return p.text||''; }).join('');
  return JSON.parse(txt);
}

/* --- Gemini TTS: aiškus, tikroviškas balsas --- */
const ttsCache = {}; // text -> {pcm, rate}
async function geminiTTS(text){
  if (ttsCache[text]) return ttsCache[text];
  const j = await gpost('gemini-2.5-flash-preview-tts', {
    contents:[{ role:'user', parts:[{ text: 'Say the following clearly, warmly and not too fast, like a friendly cartoon character talking to a child. Speak it in its original language exactly as written: ' + text }]}],
    generationConfig:{
      responseModalities:['AUDIO'],
      speechConfig:{ voiceConfig:{ prebuiltVoiceConfig:{ voiceName: S.voice } } }
    }
  });
  const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
  let inl = null;
  for (const p of parts){ if (p.inlineData || p.inline_data){ inl = p.inlineData || p.inline_data; break; } }
  if (!inl) throw new Error('TTS: nėra garso atsakyme');
  const mime = inl.mimeType || inl.mime_type || '';
  const m = /rate=(\d+)/.exec(mime);
  const out = { pcm: b64ToBytes(inl.data), rate: m ? parseInt(m[1],10) : 24000 };
  ttsCache[text] = out;
  return out;
}

/* --- Gemini Flash Image: personažo generavimas --- */
const CHAR_PROMPT = 'A single adorable little fluffy creature character in the style of a high-quality 3D animated feature film. Round soft body covered in mint-teal fur, big warm sparkling brown eyes with light reflections, tiny rounded pink-tipped ears, a cream colored fluffy belly, small stubby arms, rosy blush cheeks, one cute glowing antenna on top of the head with a small yellow light bulb tip. The character is smiling happily with its MOUTH CLOSED, facing the camera, full body visible, centered. Soft pastel purple-to-pink gradient background, dreamy soft studio lighting, subtle rim light, high quality render, square composition.';
async function genImage(parts){
  let j;
  try{
    j = await gpost('gemini-2.5-flash-image', {
      contents:[{ role:'user', parts: parts }],
      generationConfig:{ imageConfig:{ aspectRatio:'1:1' } }
    });
  }catch(e){
    // jei imageConfig nepalaikomas - bandome be jo
    j = await gpost('gemini-2.5-flash-image', { contents:[{ role:'user', parts: parts }] });
  }
  const ps = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
  for (const p of ps){
    const inl = p.inlineData || p.inline_data;
    if (inl && inl.data) return { data: inl.data, mime: inl.mimeType || inl.mime_type || 'image/png' };
  }
  throw new Error('Paveikslėlio negauta');
}
function shrink(dataUrl){
  return new Promise(function(res, rej){
    const img = new Image();
    img.onload = function(){
      const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
      const cx = cv.getContext('2d');
      cx.drawImage(img, 0, 0, 512, 512);
      let out = '';
      try{ out = cv.toDataURL('image/webp', 0.88); }catch(e){}
      if (!out || out.indexOf('image/webp') < 0) out = cv.toDataURL('image/jpeg', 0.86);
      res(out);
    };
    img.onerror = rej;
    img.src = dataUrl;
  });
}
async function generateCharacter(){
  if (!S.key){ $('#dlg').showModal(); say('Pirma įrašyk Gemini raktą ⚙️'); return; }
  const ov = $('#genOverlay'), gt = $('#genTxt');
  ov.classList.add('show');
  try{
    gt.textContent = 'Piešiu personažą... 🎨';
    say('Palauk, Gemini piešia tavo draugą! 🎨');
    const img1 = await genImage([{ text: CHAR_PROMPT }]);
    gt.textContent = 'Mokau jį kalbėti... 🗣️';
    const img2 = await genImage([
      { text: 'Edit this image: keep the EXACT same character, same colors, same pose, same background and same lighting, but now its mouth is WIDE OPEN as if speaking excitedly mid-sentence, eyes a little wider with joy. Change nothing else.' },
      { inline_data: { mime_type: img1.mime, data: img1.data } }
    ]);
    const closed = await shrink('data:' + img1.mime + ';base64,' + img1.data);
    const open   = await shrink('data:' + img2.mime + ';base64,' + img2.data);
    frames = { closed: closed, open: open };
    try{
      LS.setItem('lingo.img.closed', closed);
      LS.setItem('lingo.img.open', open);
    }catch(e){ /* localStorage pilnas - personažas veiks iki uždarymo */ }
    curFrame = ''; applyFrames();
    say('Sveikas! Aš tavo vertėjas! 🎉');
  }catch(err){
    console.error(err);
    say('Nepavyko nupiešti 😕 ' + String(err.message||'').slice(0,60));
  }finally{
    ov.classList.remove('show');
  }
}

/* ================= kalbėjimas ================= */
let curSrc = null;
function stopAudio(){
  try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  try{ if (curSrc){ curSrc.onended=null; curSrc.stop(); curSrc=null; } }catch(e){}
  if (state==='talking') setState('idle');
}
function playPcm(pcm, rate){
  const c = actx();
  const p = (c.state==='suspended') ? c.resume() : Promise.resolve();
  return p.then(function(){
    const n = Math.floor(pcm.length/2), buf = c.createBuffer(1, n, rate), ch = buf.getChannelData(0);
    const dv = new DataView(pcm.buffer, pcm.byteOffset, pcm.byteLength);
    for (let i=0;i<n;i++) ch[i] = dv.getInt16(i*2, true)/32768;
    const node = c.createBufferSource(); node.buffer = buf;
    node.playbackRate.value = S.rate;
    const an = c.createAnalyser(); an.fftSize = 256;
    const data = new Uint8Array(an.frequencyBinCount);
    node.connect(an); an.connect(c.destination);
    setState('talking');
    (function loop(){
      if (state!=='talking') return;
      an.getByteTimeDomainData(data);
      let peak=0;
      for(let i=0;i<data.length;i+=2){ const d=Math.abs(data[i]-128)/128; if(d>peak) peak=d; }
      targetOpen = Math.min(1, peak*3.2);
      requestAnimationFrame(loop);
    })();
    return new Promise(function(res){
      node.onended = function(){ curSrc=null; setState('idle'); res(); };
      node.start(); curSrc = node;
    });
  });
}
function browserSpeak(text, lang){
  return new Promise(function(res){
    if (!window.speechSynthesis) return res(false);
    const vs = speechSynthesis.getVoices();
    const l = NAME[lang].tag.toLowerCase();
    const v = vs.find(function(x){ return x.lang && x.lang.toLowerCase().replace('_','-').indexOf(l.slice(0,2))===0; });
    if (!v) return res(false);
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = S.rate; u.pitch = 1.15;
    setState('talking');
    let done = false;
    const fin = function(){ if(done) return; done=true; setState('idle'); res(true); };
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, 2000 + text.length*150);
  });
}
async function speak(text, lang){
  if (!text) return;
  stopAudio();
  try{
    const a = await geminiTTS(text);      // pagrindinis: Gemini balsas (aiškus, tikroviškas)
    await playPcm(a.pcm, a.rate);
  }catch(err){
    console.warn('Gemini TTS nepavyko, bandau telefono balsą', err);
    const ok = await browserSpeak(text, lang);   // atsarginis: telefono balsas
    if (!ok){
      setState('idle');
      if (err && err.status === 429) say('Balso limitas išnaudotas 😴 Palauk minutę');
      else say('Nepavyko įgarsinti 😕 Perskaityk: ' + text);
    }
  }
}

/* ================= UI ================= */
function showResult(d){
  const inL = NAME[d.source_lang] || NAME.lt, outL = NAME[d.target_lang] || NAME.ru;
  $('#inFlag').textContent = inL.flag;
  $('#inTxt').textContent = d.source_text;
  $('#outFlag').textContent = outL.flag; $('#outLbl').textContent = outL.name;
  $('#outTxt').textContent = d.target_text;
  $('#outTr').textContent = (S.trlit && d.transliteration) ? '[ ' + d.transliteration + ' ]' : '';
  $('#cardIn').classList.add('show'); $('#cardOut').classList.add('show');
}
function pushHist(d){
  S.hist.unshift({t:d.target_text, s:d.source_text, l:d.target_lang, tr:d.transliteration, sl:d.source_lang});
  S.hist = S.hist.slice(0,8);
  try{ LS.setItem('lingo.hist', JSON.stringify(S.hist)); }catch(e){}
  renderHist();
}
function renderHist(){
  const h = $('#hist'); h.innerHTML = '';
  S.hist.forEach(function(item){
    const b = document.createElement('button');
    b.textContent = (NAME[item.l]||NAME.ru).flag + ' ' + item.t;
    b.onclick = function(){
      if (S.busy) return;
      showResult({source_lang:item.sl, source_text:item.s, target_lang:item.l, target_text:item.t, transliteration:item.tr});
      S.last = {text:item.t, lang:item.l};
      speak(item.t, item.l);
    };
    h.appendChild(b);
  });
}

async function run(){
  if (S.busy) return;
  if (!S.key){ $('#dlg').showModal(); say('Pirma įrašyk Gemini raktą ⚙️'); return; }
  S.busy = true; stopAudio();
  const mic = $('#mic');
  try{
    setState('listening');
    mic.textContent = '⏹️';
    $('#hint').textContent = 'Klausausi... paspausk, kai baigsi';
    say('Klausausi! 👂');
    await startRec();
    await new Promise(function(res){
      const done = function(){ mic.removeEventListener('click', done); res(); };
      mic.addEventListener('click', done);
      setTimeout(function(){ if(recording) done(); }, 20000);  // maks. 20 s
    });
    const rec = stopRec();
    mic.textContent = '🎤';
    if (rec.seconds < 0.4){
      setState('idle'); say('Nieko neišgirdau 🙉 Bandom dar kartą!');
      return;
    }
    setState('thinking'); say('Galvoju... 🤔'); $('#hint').textContent = 'Verčiu...';
    const d = await translate(rec.wav);
    if (!d.source_text || !d.source_text.trim()){
      setState('idle'); say('Negirdėjau žodžių 🙉 Pabandyk garsiau!');
      return;
    }
    showResult(d); pushHist(d);
    S.last = { text:d.target_text, lang:d.target_lang };
    say((NAME[d.target_lang]||NAME.ru).flag + ' ' + d.target_text);
    $('#hint').textContent = 'Paspausk 🔊, kad pakartočiau';
    await speak(d.target_text, d.target_lang);
  } catch(err){
    setState('idle');
    const m = String(err && err.message || err);
    if (/NotAllowed|Permission|denied/i.test(m)) say('Leisk naudoti mikrofoną 🎤');
    else if (err && (err.status===400 || err.status===403)) say('Patikrink API raktą ⚙️');
    else if (err && err.status===429) say('Per daug užklausų 😴 Palauk minutę');
    else say('Oi, klaida 😕 ' + m.slice(0,60));
    console.error(err);
  } finally{
    $('#mic').textContent = '🎤';
    if (state!=='talking' && state!=='listening') setState(state==='talking'?'talking':'idle');
    if (state==='thinking') setState('idle');
    $('#hint').textContent = 'Paspausk ir kalbėk 🎤';
    S.busy = false;
  }
}

$('#mic').addEventListener('click', function(){ if(!S.busy) run(); });
$('#replay').addEventListener('click', function(){ if(S.last && !S.busy) speak(S.last.text, S.last.lang); });

$('#btnRegen').addEventListener('click', function(){

// dvigubo bakstelėjimo zoom blokavimas
let lastTouch = 0;
document.addEventListener('touchend', function(e){
  const now = Date.now();
  if (now - lastTouch < 320) e.preventDefault();
  lastTouch = now;

if (window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function(){ speechSynthesis.getVoices(); }; }

} else if (!frames.closed){

} else {

}
})();
